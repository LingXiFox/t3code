name: LingXi Nightly Release

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish even when patch-id comparison reports no-change
        required: false
        type: boolean
        default: false
      target_sha:
        description: Pinned commit SHA to release (defaults to lingxifox HEAD)
        required: false
        type: string
        default: ""
  workflow_run:
    workflows:
      - LingXi Verify
    types:
      - completed
    branches:
      - lingxifox
  workflow_call:
    inputs:
      target_sha:
        description: Verified commit SHA pushed to lingxifox by lingxi-upstream-sync
        required: true
        type: string
      force_publish:
        description: Publish even when patch-id comparison reports no-change
        required: false
        type: boolean
        default: false
      caller_verified:
        description: Must be true when invoked after upstream-sync candidate CI succeeded
        required: true
        type: boolean

concurrency:
  group: lingxi-nightly
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  VP_TELEMETRY_DISABLED: "1"

jobs:
  plan:
    name: Plan Nightly Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        startsWith(github.workflow_ref, 'LingXiFox/t3code/.github/workflows/lingxi-nightly.yml@')
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'lingxifox' &&
        github.event.workflow_run.head_repository.full_name == 'LingXiFox/t3code' &&
        vars.LINGXI_AUTO_NIGHTLY_ENABLED == 'true'
      ) ||
      (
        (
          startsWith(github.workflow_ref, 'LingXiFox/t3code/.github/workflows/lingxi-upstream-sync.yml@refs/heads/lingxifox') ||
          startsWith(github.workflow_ref, 'LingXiFox/t3code/.github/workflows/lingxi-upstream-sync-apply.yml@refs/heads/lingxifox')
        ) &&
        vars.LINGXI_AUTO_NIGHTLY_ENABLED == 'true' &&
        inputs.caller_verified == true &&
        inputs.target_sha != ''
      )
    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      commit_sha: ${{ steps.plan.outputs.commit_sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      classification: ${{ steps.plan.outputs.classification }}
      database_migration: ${{ steps.plan.outputs.database_migration }}
    steps:
      - name: Checkout pinned target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_sha || 'lingxifox' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch trusted origin refs and tags
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/lingxifox:refs/remotes/origin/lingxifox
          git fetch origin --tags --prune

      - name: Verify trusted source and LingXi Verify gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.repository }}" != "LingXiFox/t3code" ]]; then
            echo "::error::Refusing release from untrusted repository '${{ github.repository }}'."
            exit 1
          fi

          COMMIT_SHA="$(git rev-parse HEAD)"
          LINGXIFOX_HEAD="$(git rev-parse origin/lingxifox)"

          if ! git merge-base --is-ancestor "$COMMIT_SHA" "$LINGXIFOX_HEAD"; then
            echo "::error::Commit $COMMIT_SHA is not on trusted branch origin/lingxifox ($LINGXIFOX_HEAD)."
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ||
                  "${{ github.event.workflow_run.event }}" != "push" ||
                  "${{ github.event.workflow_run.head_branch }}" != "lingxifox" ||
                  "${{ github.event.workflow_run.head_repository.full_name }}" != "LingXiFox/t3code" ]]; then
              echo "::error::Untrusted workflow_run trigger metadata."
              exit 1
            fi
            if [[ "$COMMIT_SHA" != "${{ github.event.workflow_run.head_sha }}" ]]; then
              echo "::error::Checked out SHA ($COMMIT_SHA) does not match workflow_run head_sha (${{ github.event.workflow_run.head_sha }})."
              exit 1
            fi
          elif [[ "${{ github.workflow_ref }}" == LingXiFox/t3code/.github/workflows/lingxi-upstream-sync.yml@refs/heads/lingxifox* || "${{ github.workflow_ref }}" == LingXiFox/t3code/.github/workflows/lingxi-upstream-sync-apply.yml@refs/heads/lingxifox* ]]; then
            if [[ "${{ vars.LINGXI_AUTO_NIGHTLY_ENABLED }}" != "true" || "${{ inputs.caller_verified }}" != "true" ]]; then
              echo "::error::Upstream sync workflow_call Nightly trigger requires LINGXI_AUTO_NIGHTLY_ENABLED=true and caller_verified=true."
              exit 1
            fi
            if [[ "$COMMIT_SHA" != "${{ inputs.target_sha }}" || "$COMMIT_SHA" != "$LINGXIFOX_HEAD" ]]; then
              echo "::error::Upstream sync Nightly commit ($COMMIT_SHA) must match target_sha (${{ inputs.target_sha }}) and origin/lingxifox HEAD ($LINGXIFOX_HEAD)."
              exit 1
            fi
          else
            if [[ "${{ github.ref }}" != "refs/heads/lingxifox" ]]; then
              echo "::error::Manual Nightly dispatch must run from refs/heads/lingxifox (got: ${{ github.ref }})."
              exit 1
            fi
            if [[ -z "$(git tag --list 'v*-nightly.*')" && "$COMMIT_SHA" != "$LINGXIFOX_HEAD" ]]; then
              echo "::error::First Nightly release must target current origin/lingxifox HEAD ($LINGXIFOX_HEAD), got $COMMIT_SHA."
              exit 1
            fi
            VERIFY_PASSED="$(gh run list --workflow lingxi-verify.yml --commit "$COMMIT_SHA" --branch lingxifox --limit 10 --json conclusion,event --jq '[.[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length')"
            SYNC_PASSED="$(gh run list --workflow lingxi-upstream-sync.yml --commit "$COMMIT_SHA" --limit 10 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
            if [[ "$VERIFY_PASSED" == "0" && "$SYNC_PASSED" == "0" ]]; then
              echo "::error::Commit $COMMIT_SHA does not have a passing LingXi Verify or LingXi Upstream Sync run on lingxifox."
              exit 1
            fi
          fi

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Resolve version and classify changes
        id: plan
        run: |
          VERSION_JSON="$(node scripts/lingxi-release-source.ts resolve-version --channel nightly)"
          VERSION="$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$VERSION_JSON")"
          TAG="$(node -e 'console.log(JSON.parse(process.argv[1]).tag)' "$VERSION_JSON")"
          DB_MIG="$(node -e 'console.log(JSON.parse(process.argv[1]).databaseMigration)' "$VERSION_JSON")"

          CLASSIFY_JSON="$(node scripts/lingxi-release-source.ts classify-and-notes \
            --channel nightly \
            --version "$VERSION" \
            --tag "$TAG" \
            --head-ref "$commit_sha" \
            --upstream-ref origin/main \
            --notes-out release-notes.md \
            --feed-out nightly.json)"

          CLASSIFICATION="$(node -e 'console.log(JSON.parse(process.argv[1]).classification)' "$CLASSIFY_JSON")"
          SHOULD_PUBLISH="$(node -e 'console.log(JSON.parse(process.argv[1]).shouldPublishNightly)' "$CLASSIFY_JSON")"

          EXISTING_TAGS_FOR_SHA="$(git tag --points-at "$commit_sha" 'v*-nightly.*')"
          if [[ -n "$EXISTING_TAGS_FOR_SHA" && "${{ inputs.force_publish }}" != "true" ]]; then
            CLASSIFICATION="already-released"
            SHOULD_PUBLISH="false"
            echo "Commit $commit_sha already has Nightly release tag(s): $EXISTING_TAGS_FOR_SHA. Skipping duplicate release."
          elif [[ "${{ inputs.force_publish }}" == "true" ]]; then
            SHOULD_PUBLISH="true"
          fi

          if [[ "$SHOULD_PUBLISH" == "true" ]] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Target Nightly tag ${TAG} already exists."
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$commit_sha" ]]; then
            echo "::error::HEAD moved unexpectedly during planning."
            exit 1
          fi

          {
            echo "### Nightly Release Plan"
            echo ""
            echo "- **Trigger**: \`${{ github.event_name }}\` (\`${{ github.workflow_ref }}\`)"
            echo "- **Commit SHA**: \`$commit_sha\`"
            echo "- **Classification**: \`$CLASSIFICATION\`"
            echo "- **Should Publish**: \`$SHOULD_PUBLISH\`"
            echo "- **Version / Tag**: \`$VERSION\` / \`$TAG\`"
            echo "- **Database Migration**: \`$DB_MIG\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "classification=$CLASSIFICATION" >> "$GITHUB_OUTPUT"
          echo "database_migration=$DB_MIG" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata artifacts
        if: steps.plan.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: lingxi-nightly-meta
          path: |
            release-notes.md
            nightly.json
          retention-days: 3

  release:
    name: Build & Publish Nightly
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    uses: ./.github/workflows/lingxi-build-desktop.yml
    with:
      commit_sha: ${{ needs.plan.outputs.commit_sha }}
      version: ${{ needs.plan.outputs.version }}
      tag: ${{ needs.plan.outputs.tag }}
      channel: nightly
      prerelease: true
      make_latest: "false"
      meta_artifact_name: lingxi-nightly-meta
      feed_file: nightly.json
    secrets: inherit
