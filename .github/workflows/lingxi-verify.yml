name: LingXi Verify

on:
  push:
    branches:
      - lingxifox
  pull_request:
    branches:
      - lingxifox
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string
        default: lingxifox
      run_macos_smoke:
        description: Run macOS unsigned build smoke check
        required: false
        type: boolean
        default: true

concurrency:
  group: lingxi-verify-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VP_TELEMETRY_DISABLED: "1"

jobs:
  verify-core:
    name: Core Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec vp fmt --check

      - name: Lint repository
        run: pnpm exec vp lint

      - name: Check i18n catalogs
        run: pnpm exec vp run i18n:check

      - name: Typecheck core packages and desktop
        run: pnpm exec vp run --filter @t3tools/shared --filter @t3tools/contracts --filter t3 --filter @t3tools/web --filter @t3tools/desktop typecheck

      - name: Run LingXi release & update tests
        run: |
          pnpm exec vp test run \
            apps/server/src/cloud/npmRelease.test.ts \
            apps/desktop/src/updates/DesktopUpdates.test.ts \
            apps/desktop/src/updates/githubUpdateFeed.test.ts \
            packages/shared/src/cliRelease.test.ts \
            apps/web/src/components/desktopUpdate.logic.test.ts \
            apps/web/src/components/settings/updateTrackSwitch.logic.test.ts \
            scripts/lingxi-release-source.test.ts \
            scripts/lingxi-upstream-risk.test.ts \
            scripts/lingxi-upstream-sync.test.ts \
            scripts/build-desktop-artifact.test.ts \
            scripts/verify-macos-asar-manifest.test.ts

      - name: Check shell script syntax
        run: bash -n scripts/verify-macos-signing.sh

  verify-macos-smoke:
    name: macOS Build Smoke (Unsigned)
    runs-on: macos-26
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || inputs.run_macos_smoke == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop and server
        run: pnpm exec vp run --filter @t3tools/desktop --filter t3 typecheck
