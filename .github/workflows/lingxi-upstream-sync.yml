name: LingXi Upstream Sync

# Only the lingxi-* workflows may run in this fork. Upstream's own workflows are
# mirrored onto main for history and diffing, never for execution, so every sync
# disables them again: upstream adds and renames workflows often, and a freshly
# mirrored workflow starts out active.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run only (report delta without pushing or updating lingxifox)
        required: false
        type: boolean
        default: true

concurrency:
  group: lingxi-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  statuses: write

jobs:
  prepare-sync:
    name: Prepare Upstream Rebase Candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || vars.LINGXI_AUTO_SYNC_ENABLED == 'true'
    outputs:
      verify_needed: ${{ steps.sync_branch.outputs.verify_needed }}
      auto_apply_eligible: ${{ steps.sync_branch.outputs.auto_apply_eligible }}
      manual_review_required: ${{ steps.sync_branch.outputs.manual_review_required }}
      candidate_sha: ${{ steps.sync_branch.outputs.candidate_sha }}
      candidate_pushed: ${{ steps.sync_branch.outputs.candidate_pushed }}
      lingxifox_before_sha: ${{ steps.sync_branch.outputs.lingxifox_before_sha }}
      base_sha: ${{ steps.sync_branch.outputs.base_sha }}
      upstream_sha: ${{ steps.mirror_main.outputs.upstream_sha }}
      sync_branch: ${{ steps.sync_branch.outputs.sync_branch }}
      behind_count: ${{ steps.sync_branch.outputs.behind_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: lingxifox
          fetch-depth: 0
          fetch-tags: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Fetch upstream pingdotgg/t3code (without upstream tags)
        run: |
          git config user.name "lingxifox-bot"
          git config user.email "bot@lingxifox.dev"
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/pingdotgg/t3code.git
          fi
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/lingxifox:refs/remotes/origin/lingxifox

      - name: Keep only LingXi workflows enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          gh api --paginate "repos/$REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | select((.path | split("/") | last | startswith("lingxi-")) | not) | .path | split("/") | last' |
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            gh api -X PUT "repos/$REPO/actions/workflows/$name/disable" >/dev/null 2>&1 || true
          done

      - name: Mirror upstream/main to origin/main (fast-forward only)
        id: mirror_main
        run: |
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          ORIGIN_MAIN_SHA="$(git rev-parse origin/main)"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "origin_main_before_sha=$ORIGIN_MAIN_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$UPSTREAM_SHA" == "$ORIGIN_MAIN_SHA" ]]; then
            echo "main_updated=false" >> "$GITHUB_OUTPUT"
            echo "origin/main already matches upstream/main ($UPSTREAM_SHA)."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$ORIGIN_MAIN_SHA" "$UPSTREAM_SHA"; then
            echo "::error::origin/main ($ORIGIN_MAIN_SHA) has diverged from upstream/main ($UPSTREAM_SHA). Refusing non-fast-forward update."
            {
              echo "### Upstream Mirror Failed"
              echo ""
              echo "- **origin/main**: \`$ORIGIN_MAIN_SHA\`"
              echo "- **upstream/main**: \`$UPSTREAM_SHA\`"
              echo "- **Reason**: Non-fast-forward divergence on \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "main_updated=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "[dry-run] Would fast-forward origin/main from $ORIGIN_MAIN_SHA to $UPSTREAM_SHA."
          else
            git push origin "upstream/main:refs/heads/main"
          fi

      - name: Disable newly mirrored upstream workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          gh api --paginate "repos/$REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | select((.path | split("/") | last | startswith("lingxi-")) | not) | .path | split("/") | last' |
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            gh api -X PUT "repos/$REPO/actions/workflows/$name/disable" >/dev/null 2>&1 || true
          done

      - name: Cancel upstream runs the mirror push started
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          # A workflow file that arrives with the mirrored commit registers active and
          # fires once on this push; cancel that run so no upstream job ever queues here.
          for STATUS in queued in_progress; do
            gh api --paginate "repos/$REPO/actions/runs?status=$STATUS&per_page=100" \
              --jq '.workflow_runs[] | select((.path | split("/") | last | startswith("lingxi-")) | not) | .id' |
            while IFS= read -r id; do
              [[ -z "$id" ]] && continue
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 || true
            done
          done

      - name: Check delta, rebase candidate, and evaluate upstream risk
        id: sync_branch
        run: |
          set -euo pipefail
          BEHIND_COUNT="$(git rev-list --count origin/lingxifox..upstream/main)"
          UPSTREAM_SHA="${{ steps.mirror_main.outputs.upstream_sha }}"
          BASE_SHA="$(git merge-base origin/lingxifox upstream/main)"
          LINGXIFOX_BEFORE_SHA="$(git rev-parse origin/lingxifox)"
          echo "behind_count=$BEHIND_COUNT" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "lingxifox_before_sha=$LINGXIFOX_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_pushed=false" >> "$GITHUB_OUTPUT"

          if [[ "$BEHIND_COUNT" == "0" ]]; then
            echo "verify_needed=false" >> "$GITHUB_OUTPUT"
            echo "auto_apply_eligible=false" >> "$GITHUB_OUTPUT"
            echo "manual_review_required=false" >> "$GITHUB_OUTPUT"
            echo "lingxifox already includes all upstream/main commits."
            {
              echo "### Upstream Sync Check"
              echo ""
              echo "- **Status**: Up to date (0 behind commits)"
              echo "- **upstream/main**: \`$UPSTREAM_SHA\`"
              echo "- **lingxifox**: \`$LINGXIFOX_BEFORE_SHA\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "lingxifox is behind upstream/main by $BEHIND_COUNT commits."

          SYNC_BRANCH="sync/upstream-rebase"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

          git checkout -B "$SYNC_BRANCH" origin/lingxifox
          if ! git rebase upstream/main; then
            CONFLICT_FILES="$(git diff --name-only --diff-filter=U || true)"
            git rebase --abort || true
            {
              echo "### Upstream Sync Blocked (Rebase Conflict)"
              echo ""
              echo "- **Status**: Blocked — Rebase Conflict"
              echo "- **Stage**: \`git rebase upstream/main\`"
              echo "- **upstream/main**: \`$UPSTREAM_SHA\`"
              echo "- **lingxifox (preserved)**: \`$LINGXIFOX_BEFORE_SHA\`"
              echo "- **Conflicting files**:"
              if [[ -n "$CONFLICT_FILES" ]]; then
                while IFS= read -r file; do
                  echo "  - \`$file\`"
                done <<< "$CONFLICT_FILES"
              else
                echo "  - (unable to enumerate conflicted paths)"
              fi
              echo ""
              echo "#### Recovery"
              echo "1. Rebase \`lingxifox\` onto \`upstream/main\` locally and resolve conflicts carefully without dropping LingXi features."
              echo "2. Run \`pnpm exec vp run check:changed\` and push \`lingxifox\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Automatic rebase of lingxifox onto upstream/main conflicted. Manual review required; lingxifox was left untouched."
            exit 1
          fi

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

          node scripts/lingxi-upstream-risk.ts \
            --base-ref "$BASE_SHA" \
            --upstream-ref upstream/main \
            --candidate-ref HEAD \
            --json-out risk.json \
            --summary-out risk-summary.md

          cat risk-summary.md >> "$GITHUB_STEP_SUMMARY"
          REQUIRES_MANUAL_REVIEW="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("risk.json", "utf8")).requiresManualReview)')"
          echo "manual_review_required=$REQUIRES_MANUAL_REVIEW" >> "$GITHUB_OUTPUT"

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            PLAN_JSON="$(node scripts/lingxi-upstream-sync.ts plan \
              --behind-count "$BEHIND_COUNT" \
              --dry-run true \
              --manual-review-required "$REQUIRES_MANUAL_REVIEW" \
              --candidate-pushed false)"
            VERIFY_NEEDED="$(node -e 'console.log(JSON.parse(process.argv[1]).verifyNeeded)' "$PLAN_JSON")"
            AUTO_APPLY_ELIGIBLE="$(node -e 'console.log(JSON.parse(process.argv[1]).autoApplyEligible)' "$PLAN_JSON")"
            echo "verify_needed=$VERIFY_NEEDED" >> "$GITHUB_OUTPUT"
            echo "auto_apply_eligible=$AUTO_APPLY_ELIGIBLE" >> "$GITHUB_OUTPUT"
            echo "[dry-run] Rebase succeeded cleanly. Rebased LingXi commits on top of upstream/main:"
            git log --oneline upstream/main..HEAD
            echo "[dry-run] Risk requiresManualReview=$REQUIRES_MANUAL_REVIEW"
            {
              echo "### Upstream Sync Dry Run"
              echo ""
              echo "- **Status**: Dry Run (no branch pushed, no CI run, no PR opened, \`lingxifox\` untouched)"
              echo "- **Risk Level**: \`$([[ "$REQUIRES_MANUAL_REVIEW" == "true" ]] && echo "HIGH RISK" || echo "LOW RISK")\`"
              echo "- **Candidate SHA (local only)**: \`$CANDIDATE_SHA\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          REMOTE_SYNC_SHA="$(git ls-remote origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1}')"
          if [[ -n "$REMOTE_SYNC_SHA" ]]; then
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${REMOTE_SYNC_SHA}" \
              origin "HEAD:refs/heads/${SYNC_BRANCH}"
          else
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:" \
              origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi
          echo "candidate_pushed=true" >> "$GITHUB_OUTPUT"

          PLAN_JSON="$(node scripts/lingxi-upstream-sync.ts plan \
            --behind-count "$BEHIND_COUNT" \
            --dry-run false \
            --manual-review-required "$REQUIRES_MANUAL_REVIEW" \
            --candidate-pushed true)"
          VERIFY_NEEDED="$(node -e 'console.log(JSON.parse(process.argv[1]).verifyNeeded)' "$PLAN_JSON")"
          AUTO_APPLY_ELIGIBLE="$(node -e 'console.log(JSON.parse(process.argv[1]).autoApplyEligible)' "$PLAN_JSON")"
          echo "verify_needed=$VERIFY_NEEDED" >> "$GITHUB_OUTPUT"
          echo "auto_apply_eligible=$AUTO_APPLY_ELIGIBLE" >> "$GITHUB_OUTPUT"

          if [[ "$REQUIRES_MANUAL_REVIEW" == "true" ]]; then
            echo "::warning::Upstream sync is high risk; candidate $SYNC_BRANCH was pushed for full CI verification and manual review. lingxifox remains untouched."
          fi

      - name: Upload risk summary for review PR
        if: steps.sync_branch.outputs.manual_review_required == 'true' && steps.sync_branch.outputs.candidate_pushed == 'true' && inputs.dry_run != true
        uses: actions/upload-artifact@v5
        with:
          name: lingxi-upstream-risk-summary
          path: risk-summary.md
          retention-days: 1

  verify-candidate:
    name: Verify Rebased Candidate
    needs: prepare-sync
    if: needs.prepare-sync.outputs.verify_needed == 'true' && inputs.dry_run != true
    uses: ./.github/workflows/lingxi-verify.yml
    with:
      ref: ${{ needs.prepare-sync.outputs.candidate_sha }}
      run_macos_smoke: true

  record-candidate-status:
    name: Record Candidate CI Status
    needs: [prepare-sync, verify-candidate]
    if: >-
      always() &&
      needs.prepare-sync.result == 'success' &&
      needs.prepare-sync.outputs.verify_needed == 'true' &&
      inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish candidate CI commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CANDIDATE_SHA="${{ needs.prepare-sync.outputs.candidate_sha }}"
          BEFORE_SHORT="${{ needs.prepare-sync.outputs.lingxifox_before_sha }}"
          BEFORE_SHORT="${BEFORE_SHORT:0:8}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ "${{ needs.verify-candidate.result }}" == "success" ]]; then
            STATE="success"
            DESC="Candidate CI passed against lingxifox ${BEFORE_SHORT}"
          else
            STATE="failure"
            DESC="Candidate CI ${{ needs.verify-candidate.result }} against lingxifox ${BEFORE_SHORT}"
          fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${CANDIDATE_SHA}" \
            -f state="$STATE" \
            -f context="lingxi/upstream-sync-candidate-ci" \
            -f target_url="$RUN_URL" \
            -f description="${DESC:0:140}" >/dev/null

  open-review-pr:
    name: Open or Update Sync Review PR
    needs: [prepare-sync, verify-candidate, record-candidate-status]
    if: >-
      always() &&
      needs.prepare-sync.result == 'success' &&
      needs.prepare-sync.outputs.candidate_pushed == 'true' &&
      needs.prepare-sync.outputs.manual_review_required == 'true' &&
      inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: lingxifox
          fetch-depth: 0
          fetch-tags: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Download risk summary artifact
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: lingxi-upstream-risk-summary

      - name: Open or update the single review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_BRANCH="${{ needs.prepare-sync.outputs.sync_branch }}"
          CANDIDATE_SHA="${{ needs.prepare-sync.outputs.candidate_sha }}"
          BEFORE_SHA="${{ needs.prepare-sync.outputs.lingxifox_before_sha }}"
          BASE_SHA="${{ needs.prepare-sync.outputs.base_sha }}"
          UPSTREAM_SHA="${{ needs.prepare-sync.outputs.upstream_sha }}"
          BEHIND_COUNT="${{ needs.prepare-sync.outputs.behind_count }}"
          VERIFY_RESULT="${{ needs.verify-candidate.result }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "$VERIFY_RESULT" == "success" ]]; then
            PR_STATUS="verified-pending-approval"
          else
            PR_STATUS="ci-failed"
          fi

          EXISTING="$(gh pr list --head "$SYNC_BRANCH" --base lingxifox --state open --json number --jq '.[0].number // empty')"
          BODY_FILE="$(mktemp)"
          ARGS=(
            scripts/lingxi-upstream-sync.ts render-pr-body
            --sync-branch "$SYNC_BRANCH"
            --candidate-sha "$CANDIDATE_SHA"
            --lingxifox-before-sha "$BEFORE_SHA"
            --upstream-sha "$UPSTREAM_SHA"
            --base-sha "$BASE_SHA"
            --behind-count "$BEHIND_COUNT"
            --verify-result "$VERIFY_RESULT"
            --sync-run-id "${{ github.run_id }}"
            --run-url "$RUN_URL"
            --status "$PR_STATUS"
            --risk-summary-file risk-summary.md
            --out "$BODY_FILE"
          )
          if [[ -n "$EXISTING" ]]; then
            ARGS+=(--pr-number "$EXISTING")
          fi
          node "${ARGS[@]}"

          PR_TITLE="chore(sync): replay lingxifox onto upstream/main ($BEHIND_COUNT commits)"
          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body-file "$BODY_FILE"
            echo "Updated existing sync review PR #$EXISTING ($PR_STATUS)."
          else
            gh pr create --head "$SYNC_BRANCH" --base lingxifox --title "$PR_TITLE" --body-file "$BODY_FILE"
          fi

          {
            if [[ "$PR_STATUS" == "verified-pending-approval" ]]; then
              echo "### High-Risk Upstream Sync: Verified — Pending Manual Approval"
            else
              echo "### High-Risk Upstream Sync: Blocked — CI Failed"
            fi
            echo ""
            echo "- **Verify Result**: \`$VERIFY_RESULT\`"
            echo "- **Candidate Branch**: \`$SYNC_BRANCH\` (\`$CANDIDATE_SHA\`)"
            echo "- **lingxifox (untouched)**: \`$BEFORE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-failed-candidate:
    name: Cleanup Failed Low-Risk Sync Candidate
    needs: [prepare-sync, verify-candidate]
    if: >-
      always() &&
      needs.prepare-sync.result == 'success' &&
      needs.prepare-sync.outputs.auto_apply_eligible == 'true' &&
      needs.verify-candidate.result != 'success' &&
      inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete temporary sync branch and write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_BRANCH="${{ needs.prepare-sync.outputs.sync_branch }}"
          if [[ -n "$SYNC_BRANCH" ]]; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${SYNC_BRANCH}" >/dev/null 2>&1 || true
          fi
          {
            echo "### Upstream Sync Blocked (Candidate CI Failed)"
            echo ""
            echo "- **Status**: Blocked — CI Failed"
            echo "- **Verify Result**: \`${{ needs.verify-candidate.result }}\`"
            echo "- **Candidate SHA**: \`${{ needs.prepare-sync.outputs.candidate_sha }}\`"
            echo "- **Upstream SHA**: \`${{ needs.prepare-sync.outputs.upstream_sha }}\`"
            echo "- **lingxifox (preserved)**: \`${{ needs.prepare-sync.outputs.lingxifox_before_sha }}\`"
            echo "- **Cleanup**: Temporary branch \`$SYNC_BRANCH\` deleted."
          } >> "$GITHUB_STEP_SUMMARY"

  apply-sync:
    name: Update lingxifox After Candidate CI (Low-Risk)
    needs: [prepare-sync, verify-candidate]
    if: >-
      needs.prepare-sync.outputs.auto_apply_eligible == 'true' &&
      needs.verify-candidate.result == 'success' &&
      inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: lingxifox
          fetch-depth: 0
          fetch-tags: false

      - name: Update lingxifox to verified candidate SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_BRANCH="${{ needs.prepare-sync.outputs.sync_branch }}"
          CANDIDATE_SHA="${{ needs.prepare-sync.outputs.candidate_sha }}"
          BEFORE_SHA="${{ needs.prepare-sync.outputs.lingxifox_before_sha }}"

          git fetch --no-tags origin \
            "+refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" \
            "+refs/heads/lingxifox:refs/remotes/origin/lingxifox"

          ACTUAL_CANDIDATE="$(git rev-parse "refs/remotes/origin/${SYNC_BRANCH}")"
          ACTUAL_LINGXIFOX="$(git rev-parse "refs/remotes/origin/lingxifox")"
          if [[ "$ACTUAL_CANDIDATE" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Candidate branch moved unexpectedly ($ACTUAL_CANDIDATE != $CANDIDATE_SHA)."
            exit 1
          fi
          if [[ "$ACTUAL_LINGXIFOX" != "$BEFORE_SHA" ]]; then
            echo "::error::Target branch lingxifox moved unexpectedly ($ACTUAL_LINGXIFOX != $BEFORE_SHA)."
            exit 1
          fi

          git push --force-with-lease="refs/heads/lingxifox:${BEFORE_SHA}" \
            origin "${CANDIDATE_SHA}:refs/heads/lingxifox"

          EXISTING_PR="$(gh pr list --head "$SYNC_BRANCH" --base lingxifox --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr close "$EXISTING_PR" --comment "Low-risk upstream sync verified and applied to \`lingxifox\` (\`$CANDIDATE_SHA\`)." || true
          fi
          git push origin --delete "${SYNC_BRANCH}" || true

          {
            echo "### Upstream Sync Applied"
            echo ""
            echo "- **Status**: Synced"
            echo "- **Before SHA**: \`$BEFORE_SHA\`"
            echo "- **New lingxifox SHA**: \`$CANDIDATE_SHA\`"
            echo "- **Upstream SHA**: \`${{ needs.prepare-sync.outputs.upstream_sha }}\`"
            echo "- **Auto Nightly Triggered**: \`${{ vars.LINGXI_AUTO_NIGHTLY_ENABLED == 'true' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-nightly:
    name: Trigger Nightly Release (Verified Sync)
    needs: [prepare-sync, verify-candidate, apply-sync]
    if: >-
      needs.prepare-sync.outputs.auto_apply_eligible == 'true' &&
      needs.verify-candidate.result == 'success' &&
      needs.apply-sync.result == 'success' &&
      inputs.dry_run != true &&
      vars.LINGXI_AUTO_NIGHTLY_ENABLED == 'true'
    uses: ./.github/workflows/lingxi-nightly.yml
    with:
      target_sha: ${{ needs.prepare-sync.outputs.candidate_sha }}
      force_publish: false
      caller_verified: true
